name: "Build and Deploy"
on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Build on pull requests too, so a change to the build itself is exercised
  # before it reaches main. The deploy job is skipped for these; see its `if`.
  pull_request:
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Daily rebuild so future-dated posts actually publish on their date.
  # Jekyll excludes future posts (future: false by default), and this workflow otherwise only runs
  # on push - so a post dated ahead stays invisible until something unrelated triggers a build.
  # 13:00 UTC = 07:00 America/Mexico_City.
  schedule:
    - cron: "0 13 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment per ref. Scoped by ref so a pull request build
# cannot cancel a deploy already running on main.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # jekyll-og-image renders the Open Graph images during the build and needs
      # libvips to do it. Without this step the build fails rather than silently
      # shipping posts with no social preview.
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-tools libvips-dev

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    # Pull requests build and run htmlproofer, but never publish.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
