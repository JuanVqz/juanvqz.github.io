name: "Publish to dev.to"
on:
  # Right after a deploy, so a post goes out on dev.to the day it goes live here.
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]
    branches: [main]

  # dev.to imports /devto.xml on its own clock: its job runs hourly at minute 20 but
  # re-reads a feed only when the last read is over 4 hours old (Feeds::ImportArticlesWorker),
  # so the draft shows up 0 to about 4h20m after the post goes live. On Tuesdays, when the
  # weekly post goes out at 09:00 Mexico City (15:00 UTC), retry hourly at minute 35, 15
  # minutes after each possible import, until the end of the day. The daily run covers any
  # other day. A post dev.to already published is skipped, so repeated runs change nothing.
  schedule:
    - cron: "35 15-23 * * 2" # Tuesdays 09:35 to 17:35 Mexico City
    - cron: "35 21 * * *"    # daily fallback, 15:35 Mexico City
    # The backlog: one older draft (2026 posts only, see _config.yml) on Thursdays and Saturdays,
    # newest first, so the archive reaches dev.to two posts a week and followers are not flooded.
    - cron: "5 17 * * 4,6"   # Thursdays and Saturdays 11:05 Mexico City (minute 5: on-the-hour runs get dropped under load)

  workflow_dispatch:
    inputs:
      days:
        description: "Publish drafts of posts published in the last N days"
        default: "7"
      backlog:
        description: "Also publish up to N drafts of older posts, newest first"
        default: "0"

permissions:
  contents: read

concurrency:
  group: "devto-publish"
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      # Passed through env, never interpolated into the script: a value typed
      # into the manual trigger would otherwise run as shell code.
      DAYS: ${{ inputs.days || '7' }}
      # 1 only on the Thursday and Saturday backlog run (or when asked for by hand).
      BACKLOG: ${{ github.event.schedule == '5 17 * * 4,6' && '1' || inputs.backlog || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Publish dev.to drafts
        if: env.DEVTO_API_KEY != ''
        run: bundle exec jekyll-devto publish --publish --days "$DAYS" --backlog "$BACKLOG"
