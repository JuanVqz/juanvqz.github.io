name: "Publish to dev.to"
on:
  # Right after a deploy, so a post goes out on dev.to the day it goes live here.
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]
    branches: [main]

  # dev.to imports /devto.xml on its own schedule, so the draft may not exist
  # yet when the deploy finishes. Retry once a day, a few hours after the daily
  # deploy; the 7-day window catches anything a run missed. A post dev.to has
  # already published is skipped, so repeated runs change nothing.
  # 21:00 UTC = 15:00 America/Mexico_City.
  schedule:
    - cron: "0 21 * * *"

  workflow_dispatch:
    inputs:
      days:
        description: "Publish drafts of posts dated in the last N days"
        default: "7"

permissions:
  contents: read

concurrency:
  group: "devto-publish"
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      # Passed through env, never interpolated into the script: a value typed
      # into the manual trigger would otherwise run as shell code.
      DAYS: ${{ inputs.days || '7' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4

      - name: Publish dev.to drafts
        if: env.DEVTO_API_KEY != ''
        run: ruby scripts/devto-publish.rb --publish --days "$DAYS"
